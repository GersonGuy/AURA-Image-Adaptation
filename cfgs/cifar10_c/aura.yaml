SETTING: "gradual_mixed_corruption"

MODEL:
  ADAPTATION: aura
  ARCH: Standard

# ===== Evaluation Data Generation =====
MIXED_GRADUAL:
  FRAMES: 1000               
  BATCH_SIZE: 100               
  CORRUPTION_TYPES: [zoom_blur,snow,frost,fog,brightness,contrast,elastic_transform,pixelate,jpeg_compression]
  SEVERITY: 5
  SCHEDULE_TYPE: "random"

RNG_SEED: 1
CORRUPTION:
  DATASET: cifar10_c
  SEVERITY:
    - 5
  TYPE:
    - zoom_blur
    - snow
    - frost
    - fog
    - brightness
    - contrast
    - elastic_transform
    - pixelate
    - jpeg_compression
    


AURA:
  LATENT_DIM: 500
  OBS_COV_SCALE: 0.001
  GAMMA: 0.999
  INIT_COV_SCALE: 0.01
  # Path to offline-trained latent representation. Empty = cold-start (no offline meta-training).
  # To reproduce the paper's offline-AURA result, run scripts/prepare_offline.sh and paste the
  # resulting ckpt directory here (e.g. ./ckpt/offline_aura_fc/cifar10_c__Standard__500d__...).
  OFFLINE_CKPT: ""
  NUM_ADAPT_SAMPLES: 15
  NUM_EPISODES: 1000
  BN_GROUPING_MODE: "per_stage_bn" 
  STAGE_SELECTION: ["fc","stage_1"]
