# Online evaluation config for AURA with nonlinear residual lifting on CIFAR-10-C.
# Controlled comparison vs cfgs/cifar10_c/aura.yaml (linear):
#   theta = phi + z @ A + delta(z)   where delta: Linear(d,h)->GELU->Linear(h,p), h=min(d,512)
# All other settings must match the linear config for a fair ablation.
SETTING: "gradual_mixed_corruption"

MODEL:
  ADAPTATION: aura
  ARCH: Standard

MIXED_GRADUAL:
  FRAMES: 1000
  BATCH_SIZE: 100
  CORRUPTION_TYPES: [zoom_blur,snow,frost,fog,brightness,contrast,elastic_transform,pixelate,jpeg_compression]
  SEVERITY: 5
  SCHEDULE_TYPE: "random"

RNG_SEED: 1
CORRUPTION:
  DATASET: cifar10_c
  SEVERITY:
    - 5
  TYPE:
    - zoom_blur
    - snow
    - frost
    - fog
    - brightness
    - contrast
    - elastic_transform
    - pixelate
    - jpeg_compression

AURA:
  LATENT_DIM: 500
  OBS_COV_SCALE: 0.001
  GAMMA: 0.999
  INIT_COV_SCALE: 0.01
  OFFLINE_CKPT: ""   # set to nonlinear offline checkpoint after training
  NUM_ADAPT_SAMPLES: 15
  NUM_EPISODES: 1000
  BN_GROUPING_MODE: "per_stage_bn"
  STAGE_SELECTION: ["fc","stage_1"]
  # Nonlinear residual lifting
  LIFTING:
    TYPE: "nonlinear"
    RESIDUAL_LINEAR: True
    HIDDEN_DIMS: [500]
    ACTIVATION: "gelu"
    NORMALIZATION: "none"
    OUTPUT_SCALE: 1.0
    ZERO_INIT_OUTPUT: True
