# Frozen source model on ViT-B/16 — reference error for the ViT experiments.
# ViT-B/16 (timm ImageNet-1k weights) counterpart of source.yaml.

SETTING: "gradual_mixed_corruption"

# ===== Evaluation Data Generation (identical to aura_vit.yaml) =====
MIXED_GRADUAL:
  FRAMES: 1000
  BATCH_SIZE: 64
  CORRUPTION_TYPES: ["motion_blur", "defocus_blur", "shot_noise", "gaussian_noise", "glass_blur", "impulse_noise"]
  SEVERITY: 5
  SCHEDULE_TYPE: "random"

RNG_SEED: 1

TEST:
  BATCH_SIZE: 64

MODEL:
  ADAPTATION: source
  ARCH: vit_base_patch16_224

CORRUPTION:
  DATASET: imagenet_c
  SEVERITY:
    - 5
  TYPE:
    - gaussian_noise
    - shot_noise
    - impulse_noise
    - defocus_blur
    - glass_blur
    - motion_blur
    - zoom_blur
