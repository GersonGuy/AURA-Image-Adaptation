SETTING: "gradual_mixed_corruption"

MODEL:
  ADAPTATION: aura
  ARCH: resnet18_mnist
  CKPT_PATH: "./ckpt/resnet18_mnist.pth"

MIXED_GRADUAL:
  FRAMES: 1000
  BATCH_SIZE: 100
  CORRUPTION_TYPES: ["shot_noise","impulse_noise","motion_blur","glass_blur","fog","brightness"]
  SEVERITY: 1
  SCHEDULE_TYPE: "random"

RNG_SEED: 1
CORRUPTION:
  DATASET: mnist_c
  SEVERITY:
    - 1
  TYPE:
    - shot_noise
    - impulse_noise
    - motion_blur
    - glass_blur
    - fog
    - brightness

AURA:
  LATENT_DIM: 500
  OBS_COV_SCALE: 0.001
  GAMMA: 0.999
  INIT_COV_SCALE: 0.01
  OFFLINE_CKPT: ""
  NUM_ADAPT_SAMPLES: 15
  NUM_EPISODES: 1000
  BN_GROUPING_MODE: "per_stage_bn"
  STAGE_SELECTION: ["fc","stage_1","stage_2","stage_3","stage_4"]
  JACOBIAN_MODE: "auto"
  JAC_CHUNK_SIZE: 0
